name: Export apksigner once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-apksigner-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install official Android Build Tools 36.0.0
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
          mkdir -p signer-tool
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" signer-tool/apksigner.jar
          sha256sum signer-tool/apksigner.jar > signer-tool/SHA256SUMS.txt
      - name: Upload apksigner jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-apksigner-36.0.0-one-time
          path: signer-tool/
          if-no-files-found: error
          retention-days: 1

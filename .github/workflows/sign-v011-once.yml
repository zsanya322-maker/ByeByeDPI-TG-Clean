name: Sign v0.1.1 release once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sign-v011-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install APK signing tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"

      - name: Download exact audited unsigned v0.1.1 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/zsanya322-maker/ByeByeDPI-TG-Clean/actions/artifacts/9245192655/zip" \
            -o audited-artifact.zip
          mkdir audited
          unzip -q audited-artifact.zip -d audited
          echo "37baabc89421a55e201f86d7454507b8a7d7e2a2a2b650a16550f30c2848f2f6  audited/ByeByeDPI-TG-Clean-v0.1.1-arm64-v8a-release-unsigned-aligned.apk" | sha256sum -c -

      - name: Install one-time backup recipient certificate
        shell: bash
        run: |
          cat > recipient-cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIFTzCCAzegAwIBAgIUYWzoEdMts9eN+NqmJdmXw6UuyUEwDQYJKoZIhvcNAQEL
          BQAwNzE1MDMGA1UEAwwsQnllQnllRFBJIFRHIENsZWFuIE9uZS1UaW1lIEJhY2t1
          cCBSZWNpcGllbnQwHhcNMjYwODE1MDk0NzIwWhcNMjYwODE3MDk0NzIwWjA3MTUw
          MwYDVQQDDCxCeWVCeWVEUEkgVEcgQ2xlYW4gT25lLVRpbWUgQmFja3VwIFJlY2lw
          aWVudDCCAiIwDQYJKoZIhvcNAQEBBQADggIPADCCAgoCggIBAN9rKJ8QTXrzYSxz
          CwEsjzQSXZ6d8rY71rz+83Qa66Vj9ujq1oePJyaEFoo/zSea+hRC6wAjQqLSR+0i
          C6e1F8YM/0LMJdKZNtkokXe8RmPbOLtQCIM363Ny81dKvxqv6Kw6DoicLGAjsQMx
          44XwChMe0SUS++BQei3QmtUb4bBQVbD8SPmyO/DTNUr/TM2qH6BlX8Bvlc5xTtht
          YpXvsH+gLrP1VadGyGdEPoFmGUUbwwqGU47bQqr17pZFVMqUXwq4cDtHAVV4xevi
          KEi6IcZ3g1Ubkd22/iWo0X0WwObHdaOB0Xbln0XJB+qJGvHzMtndusWuVteSWcBd
          ZQqJQRuwZchGPmPWnPHQ3P2Q0HFue8Ho/AOwzOYKn3ctBuHh9KmgVBtFDWOLmlbR
          OSMoAv7mQ/FVT8i3td0PC1ph+191KmXyJD0JL3Zkb1kiUD5NNnxhjuBqdKjT1aVo
          jbICY1ftWVIU//0EBOC4CuA/EtdDK3e7C30bWg+5FoEYGesdEyyGS6ZKlA70xB14
          zSAW4ojwjF3Kybs9JBEPzz2sSkturWSNV1S6UFPgwIVmNXZwRyxbITH9pAOYlhRb
          xODV80e9MhvQwl/kwPX22OOSlpjDyd51sI6LAQGm9/L7bTUY2zzurUH34pDeb0L8
          Hx80c7tSHTMR540B5fVXvevcxd0VAgMBAAGjUzBRMB0GA1UdDgQWBBRZXftERCBS
          ywOuD0QT+zW/gPRXADAfBgNVHSMEGDAWgBRZXftERCBSywOuD0QT+zW/gPRXADAP
          BgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4ICAQAOJsFXqAPSbL3LYn/W
          yi3ewVTQaCPLjcEBxJSTDIajG5hcXUW+OAqMO72ELwPaaXP58dc0MZYo7guawEDy
          A7LcJwbAn1HznSfM4s4Jih//IxcWX2Wg32l1+dA1wmP3AjMoyawh1Vx9rxmznjod
          j5SY5STF78dDwqpMRuzvdl3bYZiXmmdLXdbtwkxTzxpr9TMjPfogT9rkAXF6l/lt
          9m45bPpuCGbM1oQ9/W4SHsjFQ+JOtBalBqOqeFhvHfJDY2OC9fkFYVCs/vA/CqO6
          Sulb6BodJ7z4WQpJ8pOyOk7CXL7NTLM4Yp6a88hXRyCyN2TqdfHHfI325umQcg8u
          ZHXzQAd6Cx5ZkRejyvRtrY1XcHwOsNR0O3lBghVJWGNyqjJL3mwR2boeFdbfEQPi
          R70eDiwwg3AkKmOWKojiAswcP7GuxsQBmWdHYQwrmUwF5rcbKS3XliF6KhPypv5P
          wm72kfDXwyqdIZWmKgfVumPIC4abgoX6eZDPtyefanC72Zpf3lxDPS7hnNXGAKxH
          jGBiGpmH7vYSWAqqvwG6IGbWppIUO8g8VTPUTMXAb8oJIkAgBgK+hvo3+b53j/gr
          sNAagCxjdOSCEVFf6XKc5SMDOdChKyBrWr2VeQa0EBt41ocXXqFN1yX3Yk0LAWOD
          tfeovcyGxuBEq/xnUYqUrddJgA==
          -----END CERTIFICATE-----
          CERT
          openssl x509 -in recipient-cert.pem -noout -fingerprint -sha256

      - name: Generate persistent release key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          KS_PASS="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$KS_PASS"
          export KS_PASS

          keytool -genkeypair -noprompt \
            -keystore tgclean-release.p12 \
            -storetype PKCS12 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -alias tgclean-release \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=ByeByeDPI TG Clean, OU=Release Signing, O=zsanya322-maker"

          mkdir -p signed private-backup
          "$BT/apksigner" sign \
            --ks tgclean-release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias tgclean-release \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out signed/ByeByeDPI-TG-Clean-v0.1.1-arm64-v8a-release.apk \
            audited/ByeByeDPI-TG-Clean-v0.1.1-arm64-v8a-release-unsigned-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs signed/ByeByeDPI-TG-Clean-v0.1.1-arm64-v8a-release.apk \
            | tee signed/SIGNATURE_VERIFY.txt
          "$BT/zipalign" -c -p 4 signed/ByeByeDPI-TG-Clean-v0.1.1-arm64-v8a-release.apk
          sha256sum signed/ByeByeDPI-TG-Clean-v0.1.1-arm64-v8a-release.apk | tee signed/SHA256SUMS.txt

          cp tgclean-release.p12 private-backup/ByeByeDPI-TG-Clean-release-master.p12
          printf '%s\n' "$KS_PASS" > private-backup/KEYSTORE_PASSWORD.txt
          cat > private-backup/README-KEEP-PRIVATE.txt <<'EOF'
          MASTER UPDATE SIGNING KEY FOR ByeByeDPI-TG-Clean.
          Never commit or upload the decrypted .p12 or password to the public repository.
          Alias: tgclean-release
          Store type: PKCS12
          The same password protects both store and key.
          Losing this key prevents future APKs from updating installations signed by it.
          EOF
          tar -C private-backup -cf signing-backup.tar .
          openssl cms -encrypt -binary -aes-256-cbc \
            -in signing-backup.tar \
            -outform DER \
            -out signed/ByeByeDPI-TG-Clean-v0.1.1-signing-backup.encrypted.cms \
            recipient-cert.pem

          rm -rf private-backup signing-backup.tar tgclean-release.p12
          unset KS_PASS

      - name: Upload signed release and encrypted key backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ByeByeDPI-TG-Clean-v0.1.1-signed-release
          path: signed/
          if-no-files-found: error
          retention-days: 30
